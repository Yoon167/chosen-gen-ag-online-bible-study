<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Saved Bible study presentation for Chosen Gen AG."
  />
  <title>Teaching Presentation | Chosen Gen AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css?v=teaching-release-2" />
</head>
<body class="previous-teaching-page">
  <main class="teaching-page-shell">
    <nav class="teaching-nav" aria-label="Previous teaching navigation">
      <a class="back-link" href="index.html">
        <span aria-hidden="true">←</span>
        Back to Bible study
      </a>
      <p class="teaching-nav__brand">CHOSEN GEN AG</p>
    </nav>

    <p class="browser-open" id="browser-open" hidden>
      <a class="browser-open__link" id="browser-open-link" href="#">Open in Chrome</a>
    </p>

    <header class="teaching-hero">
      <p class="teaching-hero__eyebrow">TEACHING LIBRARY</p>
      <h1 id="teaching-title">Teaching presentation</h1>
      <p class="teaching-hero__subtitle" id="teaching-subtitle">A saved Bible study presentation</p>
      <p class="teaching-hero__verse" id="teaching-verse" hidden></p>
    </header>

    <section class="web-deck saved-presentation" id="saved-presentation" aria-labelledby="saved-presentation-heading">
      <div class="web-deck__heading">
        <div>
          <p class="section-label">SAVED PRESENTATION</p>
          <h2 id="saved-presentation-heading">Teaching presentation</h2>
        </div>
      </div>
      <p class="saved-presentation__message" id="saved-presentation-message" aria-live="polite">Loading presentation...</p>
      <iframe
        class="saved-presentation__frame"
        id="saved-presentation-frame"
        title="Saved teaching presentation"
        allowfullscreen
        hidden
      ></iframe>
      <a class="saved-presentation__link" id="saved-presentation-link" href="#" target="_blank" rel="noopener" hidden>Open presentation in Google Drive</a>
    </section>
  </main>

  <script type="module" src="saved-teaching.js?v=saved-presentations-2"></script>
</body>
</html>
