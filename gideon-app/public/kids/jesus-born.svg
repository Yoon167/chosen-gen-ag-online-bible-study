      <path d="M-30 -10 Q0 -70 30 -10 Q24 -40 0 -44 Q-24 -40 -30 -10Z" fill="#1d4ed8"/>
      <circle cy="-30" r="20" fill="#e8b48a"/>
      <path d="M-20 -34 Q0 -64 20 -34 Q14 -50 0 -50 Q-14 -50 -20 -34Z" fill="#1d4ed8"/>
      <path d="M-8 -30 q3 3 6 0 M2 -30 q3 3 6 0" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-6 -20 Q0 -16 6 -20" stroke="#7c2d12" stroke-width="2.5" fill="none"/>
    </g>
    <!-- Joseph -->
    <g transform="translate(90 140)">
      <path d="M-34 80 Q-38 -10 0 -24 Q38 -10 34 80Z" fill="#a16207"/>
      <circle cy="-36" r="22" fill="#c68b62"/>
      <path d="M-22 -30 Q0 6 22 -30 Q18 -10 0 -8 Q-18 -10 -22 -30Z" fill="#422006"/>
      <path d="M-22 -40 Q-20 -64 0 -62 Q20 -64 22 -40 Q14 -54 0 -54 Q-14 -54 -22 -40Z" fill="#422006"/>
      <circle cx="-8" cy="-38" r="2.5" fill="#1e293b"/><circle cx="8" cy="-38" r="2.5" fill="#1e293b"/>
      <path d="M40 90 L44 -60" stroke="#713f12" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- Manger with baby Jesus -->
    <g transform="translate(0 190)">
      <path d="M-60 -10 H60 L46 34 H-46Z" fill="#b45309"/>
      <path d="M-50 34 L-60 60 M50 34 L60 60" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
      <path d="M-62 -10 Q-40 -26 -20 -12 Q0 -28 20 -12 Q40 -26 62 -10Z" fill="#fde047"/>
      <ellipse cx="0" cy="-20" rx="30" ry="15" fill="#fef9c3"/>
      <circle cx="-22" cy="-26" r="13" fill="#f1c39a"/>
      <path d="M-28 -26 q3 3 6 0 M-20 -26 q3 3 6 0" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="-22" cy="-26" r="26" fill="none" stroke="#fde047" stroke-width="3" opacity=".6"/>
    </g>
  </g>
  <!-- Sheep -->
  <g transform="translate(130 520)">
    <g fill="#f8fafc"><circle r="24"/><circle cx="22" cy="-6" r="20"/><circle cx="-22" cy="-4" r="20"/><circle cx="0" cy="-18" r="20"/></g>
    <ellipse cx="38" cy="-6" rx="12" ry="14" fill="#334155"/><circle cx="42" cy="-10" r="2.5" fill="#fff"/>
    <path d="M-10 20 v16 M10 20 v16" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(680 530) scale(-.8 .8)">
    <g fill="#f8fafc"><circle r="24"/><circle cx="22" cy="-6" r="20"/><circle cx="-22" cy="-4" r="20"/><circle cx="0" cy="-18" r="20"/></g>
    <ellipse cx="38" cy="-6" rx="12" ry="14" fill="#334155"/><circle cx="42" cy="-10" r="2.5" fill="#fff"/>
    <path d="M-10 20 v16 M10 20 v16" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
