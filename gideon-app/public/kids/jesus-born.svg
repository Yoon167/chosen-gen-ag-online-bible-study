<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fef08a" stop-opacity=".95"/><stop offset="1" stop-color="#fef08a" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#fde68a" stop-opacity=".7"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#night)"/>
  <g fill="#fef3c7"><circle cx="80" cy="60" r="2.5"/><circle cx="200" cy="120" r="2"/><circle cx="660" cy="70" r="2.5"/><circle cx="740" cy="160" r="2"/><circle cx="560" cy="40" r="2"/><circle cx="120" cy="200" r="2"/></g>
  <!-- The star -->
  <circle cx="400" cy="90" r="90" fill="url(#glow)"/>
  <path d="M400 40 L414 78 L454 80 L422 104 L434 144 L400 120 L366 144 L378 104 L346 80 L386 78Z" fill="#fde047"/>
  <path d="M400 150 L400 270" stroke="#fde047" stroke-width="4" opacity=".6"/>
  <!-- Hills -->
  <path d="M0 470 Q200 420 400 460 Q600 500 800 450 V600 H0Z" fill="#14532d"/>
  <!-- Stable -->
  <g transform="translate(400 300)">
    <path d="M-190 40 L0 -60 L190 40Z" fill="#78350f"/>
    <rect x="-170" y="36" width="340" height="190" fill="#92400e"/>
    <rect x="-150" y="56" width="300" height="170" fill="#451a03"/>
    <circle cx="0" cy="150" r="170" fill="url(#warm)"/>
    <!-- Mary -->
    <g transform="translate(-80 150)">
