<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#334155"/><stop offset=".55" stop-color="#64748b"/><stop offset="1" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <radialGradient id="sun" cx=".85" cy=".1" r=".5"><stop offset="0" stop-color="#fef08a" stop-opacity=".9"/><stop offset="1" stop-color="#fef08a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#sun)"/>
  <!-- Storm clouds and rain (left) -->
  <g fill="#1e293b">
    <circle cx="80" cy="80" r="60"/><circle cx="160" cy="60" r="70"/><circle cx="250" cy="90" r="56"/><rect x="40" y="80" width="250" height="60"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" opacity=".7">
    <path d="M70 160 l-12 40 M120 170 l-12 40 M170 160 l-12 40 M220 170 l-12 40 M270 160 l-12 40 M95 230 l-12 40 M195 230 l-12 40"/>
  </g>
  <path d="M190 140 L170 200 H196 L176 260" stroke="#facc15" stroke-width="8" fill="none" stroke-linejoin="round"/>
  <!-- Sun breaking through (right) -->
  <circle cx="690" cy="80" r="44" fill="#fde047"/>
  <g stroke="#fde047" stroke-width="6" stroke-linecap="round" opacity=".8"><path d="M690 16 v-12 M754 80 h12 M735 35 l9 -9 M645 35 l-9 -9"/></g>
  <!-- Sea -->
  <path d="M0 360 Q60 320 120 360 T240 360 Q300 330 360 360 T480 370 Q560 360 640 370 T800 368 V600 H0Z" fill="url(#sea)"/>
  <!-- Boat -->
  <g transform="translate(400 380) rotate(-4)">
    <path d="M-200 0 H200 Q170 90 120 96 H-120 Q-170 90 -200 0Z" fill="#a16207"/>
    <path d="M-190 24 H190" stroke="#713f12" stroke-width="6"/>
    <path d="M-30 0 V-210" stroke="#713f12" stroke-width="10"/>
    <path d="M-26 -200 Q70 -140 60 -20 H-26Z" fill="#f8fafc"/>
    <!-- Jesus standing, arm raised -->
    <g transform="translate(-110 -10)">
      <path d="M-26 0 Q-30 -60 0 -66 Q30 -60 26 0Z" fill="#f8fafc"/>
      <path d="M10 -60 L22 -66 L16 0" fill="#dc2626"/>
      <path d="M18 -54 Q50 -80 58 -120" stroke="#f8fafc" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="60" cy="-126" r="9" fill="#c68b62"/>
      <circle cy="-88" r="24" fill="#c68b62"/>
      <path d="M-24 -84 Q0 -50 24 -84 Q20 -64 0 -62 Q-20 -64 -24 -84Z" fill="#422006"/>
      <path d="M-26 -92 Q-22 -120 0 -118 Q22 -120 26 -92 Q16 -108 0 -108 Q-16 -108 -26 -92Z" fill="#422006"/>
      <circle cx="-8" cy="-90" r="2.5" fill="#1e293b"/><circle cx="8" cy="-90" r="2.5" fill="#1e293b"/>
    </g>
    <!-- Two disciples, amazed -->
    <g transform="translate(70 -6)">
      <path d="M-18 0 Q-20 -40 0 -44 Q20 -40 18 0Z" fill="#16a34a"/>
      <circle cy="-60" r="18" fill="#e8b48a"/>
      <circle cx="-6" cy="-62" r="3" fill="#1e293b"/><circle cx="6" cy="-62" r="3" fill="#1e293b"/>
      <ellipse cy="-50" rx="4" ry="5" fill="#7c2d12"/>
    </g>
    <g transform="translate(130 -4)">
      <path d="M-18 0 Q-20 -40 0 -44 Q20 -40 18 0Z" fill="#7c3aed"/>
      <circle cy="-60" r="18" fill="#d6a37a"/>
      <circle cx="-6" cy="-62" r="3" fill="#1e293b"/><circle cx="6" cy="-62" r="3" fill="#1e293b"/>
      <ellipse cy="-50" rx="4" ry="5" fill="#7c2d12"/>
    </g>
  </g>
  <!-- Calm water in front -->
  <path d="M0 520 Q200 505 400 520 T800 520 V600 H0Z" fill="#0891b2" opacity=".8"/>
  <path d="M100 548 h60 M360 560 h80 M600 548 h70" stroke="#cffafe" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</svg>
