    <circle cx="-8" cy="-18" r="3" fill="#1e293b"/><circle cx="8" cy="-18" r="3" fill="#1e293b"/>
    <path d="M-8 -4 Q0 2 8 -4" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Floor -->
  <path d="M0 470 Q400 430 800 470 V600 H0Z" fill="#57534e"/>
  <!-- Daniel kneeling, praying -->
