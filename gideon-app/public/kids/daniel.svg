    <path d="M-14 -60 q4 4 8 0 M6 -60 q4 4 8 0" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-8 -44 Q0 -38 8 -44" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Lion (left), sleepy and friendly -->
  <g transform="translate(170 470)">
    <ellipse cx="40" cy="20" rx="80" ry="38" fill="#f59e0b"/>
    <circle cx="-30" cy="-10" r="56" fill="#c2410c"/>
    <circle cx="-30" cy="-10" r="38" fill="#fbbf24"/>
    <path d="M-44 -16 q6 6 12 0 M-28 -16 q6 6 12 0" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-30" cy="2" rx="8" ry="5" fill="#7c2d12"/>
    <path d="M-38 12 Q-30 20 -22 12" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M118 24 q24 -6 26 -32" stroke="#f59e0b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="146" cy="-12" r="9" fill="#c2410c"/>
    <text x="10" y="-60" font-family="Arial" font-size="30" font-weight="bold" fill="#fef3c7" opacity=".8">z z</text>
  </g>
  <!-- Lion (right), smiling -->
  <g transform="translate(640 470) scale(-1 1)">
    <ellipse cx="40" cy="20" rx="80" ry="38" fill="#f59e0b"/>
    <circle cx="-30" cy="-10" r="56" fill="#c2410c"/>
    <circle cx="-30" cy="-10" r="38" fill="#fbbf24"/>
    <circle cx="-42" cy="-16" r="4" fill="#1e293b"/><circle cx="-18" cy="-16" r="4" fill="#1e293b"/>
