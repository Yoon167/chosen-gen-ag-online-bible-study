<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="cave" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#78350f"/><stop offset="1" stop-color="#292524"/></radialGradient>
    <radialGradient id="light" cx=".5" cy=".2" r=".6"><stop offset="0" stop-color="#fef9c3" stop-opacity=".9"/><stop offset="1" stop-color="#fef9c3" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cave)"/>
  <!-- Rocks around the den -->
  <path d="M0 0 H800 V120 Q700 60 600 110 Q480 40 400 90 Q300 30 200 100 Q100 50 0 120Z" fill="#44403c"/>
  <!-- Light from the angel -->
  <path d="M330 0 L470 0 L620 600 L180 600Z" fill="url(#light)"/>
  <!-- Angel -->
  <g transform="translate(400 120)">
