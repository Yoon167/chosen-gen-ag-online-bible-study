    <g transform="translate(70 -40)">
      <path d="M-50 -10 H50 L38 40 H-38Z" fill="#b45309"/>
      <path d="M-46 4 H46 M-42 20 H42" stroke="#78350f" stroke-width="4"/>
      <path d="M-40 -10 Q0 -60 40 -10" stroke="#92400e" stroke-width="6" fill="none"/>
      <!-- 5 loaves -->
      <g fill="#f59e0b" stroke="#b45309" stroke-width="2">
        <ellipse cx="-30" cy="-16" rx="14" ry="9"/><ellipse cx="-12" cy="-22" rx="14" ry="9"/><ellipse cx="6" cy="-16" rx="14" ry="9"/><ellipse cx="22" cy="-24" rx="13" ry="8"/><ellipse cx="34" cy="-14" rx="12" ry="8"/>
      </g>
      <!-- 2 fish -->
      <g transform="translate(-16 -36)"><path d="M0 0 q14 -10 28 0 q-14 10 -28 0Z" fill="#94a3b8"/><path d="M28 0 l10 -7 v14Z" fill="#94a3b8"/><circle cx="7" cy="-1" r="2" fill="#1e293b"/></g>
      <g transform="translate(14 -42)"><path d="M0 0 q14 -10 28 0 q-14 10 -28 0Z" fill="#cbd5e1"/><path d="M28 0 l10 -7 v14Z" fill="#cbd5e1"/><circle cx="7" cy="-1" r="2" fill="#1e293b"/></g>
    </g>
    <path d="M22 -30 Q40 -40 40 -60" stroke="#e8b48a" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Twelve baskets left over (a few shown) -->
  <g transform="translate(690 520)">
    <path d="M-30 -14 H30 L22 20 H-22Z" fill="#a16207"/><g fill="#f59e0b"><ellipse cx="-12" cy="-18" rx="11" ry="7"/><ellipse cx="10" cy="-20" rx="11" ry="7"/></g>
  </g>
  <g transform="translate(80 530)">
    <path d="M-30 -14 H30 L22 20 H-22Z" fill="#a16207"/><g fill="#f59e0b"><ellipse cx="-12" cy="-18" rx="11" ry="7"/><ellipse cx="10" cy="-20" rx="11" ry="7"/></g>
  </g>
</svg>
