<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#fef9c3" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#night)"/>
  <rect x="400" width="400" height="600" fill="url(#day)"/>
  <!-- Moon and stars -->
  <g fill="#fde68a">
    <path d="M120 120 a50 50 0 1 0 50 62 a40 40 0 1 1 -50 -62Z"/>
    <path d="M250 70 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2Z"/>
    <path d="M330 150 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1Z"/>
    <circle cx="60" cy="60" r="3"/><circle cx="200" cy="180" r="3"/><circle cx="300" cy="40" r="2.5"/><circle cx="360" cy="230" r="2.5"/><circle cx="40" cy="250" r="2.5"/>
  </g>
  <!-- Sun -->
  <circle cx="650" cy="120" r="110" fill="url(#glow)"/>
  <circle cx="650" cy="120" r="55" fill="#facc15"/>
  <g stroke="#facc15" stroke-width="8" stroke-linecap="round">
    <path d="M650 40 v-18 M650 200 v18 M570 120 h-18 M730 120 h18 M594 64 l-13 -13 M706 176 l13 13 M594 176 l-13 13 M706 64 l13 -13"/>
  </g>
  <!-- Birds -->
  <g fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round">
    <path d="M480 90 q12 -12 24 0 q12 -12 24 0"/><path d="M540 160 q9 -9 18 0 q9 -9 18 0"/>
  </g>
  <!-- Land -->
  <path d="M0 420 Q140 340 300 400 Q460 450 600 380 Q720 330 800 370 V600 H0Z" fill="#4ade80"/>
  <path d="M0 460 Q160 410 330 450 Q520 490 800 430 V600 H0Z" fill="#22c55e"/>
  <!-- Trees -->
  <g>
    <rect x="128" y="360" width="16" height="60" rx="4" fill="#92400e"/><circle cx="136" cy="345" r="40" fill="#16a34a"/>
    <circle cx="120" cy="335" r="8" fill="#ef4444"/><circle cx="152" cy="355" r="8" fill="#ef4444"/>
    <rect x="612" y="330" width="14" height="56" rx="4" fill="#92400e"/><circle cx="619" cy="316" r="34" fill="#15803d"/>
  </g>
  <!-- Giraffe and bunny -->
  <g transform="translate(470 330)">
    <rect x="0" y="0" width="60" height="34" rx="16" fill="#fbbf24"/>
    <rect x="44" y="-62" width="12" height="68" rx="6" fill="#fbbf24"/>
    <ellipse cx="56" cy="-66" rx="18" ry="11" fill="#fbbf24"/>
    <circle cx="62" cy="-68" r="2.5" fill="#1e293b"/>
    <path d="M6 30 v26 M22 30 v26 M40 30 v26 M54 30 v26" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
    <circle cx="16" cy="12" r="4" fill="#b45309"/><circle cx="36" cy="18" r="4" fill="#b45309"/><circle cx="50" cy="-30" r="3" fill="#b45309"/>
  </g>
  <g transform="translate(260 430)">
    <ellipse cx="0" cy="0" rx="20" ry="16" fill="#fff"/><circle cx="14" cy="-14" r="11" fill="#fff"/>
    <ellipse cx="12" cy="-34" rx="4" ry="12" fill="#fff"/><ellipse cx="20" cy="-32" rx="4" ry="12" fill="#fff"/>
    <circle cx="18" cy="-15" r="2" fill="#1e293b"/>
  </g>
  <!-- Flowers -->
  <g>
    <circle cx="80" cy="500" r="9" fill="#f472b6"/><circle cx="80" cy="500" r="4" fill="#fde047"/>
    <circle cx="340" cy="520" r="9" fill="#a78bfa"/><circle cx="340" cy="520" r="4" fill="#fde047"/>
    <circle cx="560" cy="505" r="9" fill="#fb923c"/><circle cx="560" cy="505" r="4" fill="#fde047"/>
  </g>
  <!-- Water with fish -->
  <path d="M640 600 Q660 520 760 520 Q800 520 800 520 V600Z" fill="url(#sea)"/>
  <g transform="translate(720 565)"><path d="M0 0 q20 -16 40 0 q-20 16 -40 0Z" fill="#fb923c"/><path d="M40 0 l14 -10 v20Z" fill="#fb923c"/><circle cx="10" cy="-2" r="2.5" fill="#1e293b"/></g>
</svg>
