<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="130" cy="130" r="60" fill="#fef3c7"/>
  <!-- Pyramids -->
  <path d="M470 430 L600 220 L730 430Z" fill="#d97706"/><path d="M600 220 L730 430 H640Z" fill="#b45309"/>
  <path d="M600 430 L680 300 L760 430Z" fill="#f59e0b"/><path d="M680 300 L760 430 H710Z" fill="#d97706"/>
  <!-- Desert -->
  <path d="M0 420 Q200 380 400 420 T800 410 V600 H0Z" fill="url(#sand)"/>
  <!-- Wheat sheaves -->
  <g transform="translate(110 420)">
    <g stroke="#a16207" stroke-width="5" stroke-linecap="round"><path d="M0 0 L-20 -90 M0 0 L0 -100 M0 0 L20 -90"/></g>
    <g fill="#eab308"><ellipse cx="-20" cy="-100" rx="10" ry="22"/><ellipse cx="0" cy="-112" rx="10" ry="22"/><ellipse cx="20" cy="-100" rx="10" ry="22"/></g>
    <rect x="-16" y="-40" width="32" height="10" rx="4" fill="#92400e"/>
  </g>
  <g transform="translate(200 440) scale(.8)">
    <g stroke="#a16207" stroke-width="5" stroke-linecap="round"><path d="M0 0 L-20 -90 M0 0 L0 -100 M0 0 L20 -90"/></g>
    <g fill="#eab308"><ellipse cx="-20" cy="-100" rx="10" ry="22"/><ellipse cx="0" cy="-112" rx="10" ry="22"/><ellipse cx="20" cy="-100" rx="10" ry="22"/></g>
    <rect x="-16" y="-40" width="32" height="10" rx="4" fill="#92400e"/>
  </g>
  <!-- Joseph in his colorful coat -->
  <g transform="translate(400 300)">
    <!-- coat stripes -->
    <clipPath id="coat"><path d="M-70 40 Q-60 -10 0 -20 Q60 -10 70 40 L80 220 H-80Z"/></clipPath>
    <g clip-path="url(#coat)">
      <rect x="-90" y="-30" width="30" height="260" fill="#ef4444"/>
      <rect x="-60" y="-30" width="30" height="260" fill="#f97316"/>
      <rect x="-30" y="-30" width="30" height="260" fill="#facc15"/>
      <rect x="0" y="-30" width="30" height="260" fill="#22c55e"/>
      <rect x="30" y="-30" width="30" height="260" fill="#3b82f6"/>
      <rect x="60" y="-30" width="30" height="260" fill="#8b5cf6"/>
    </g>
    <!-- arms open -->
    <path d="M-62 30 Q-120 40 -140 -10" stroke="#ef4444" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M62 30 Q120 40 140 -10" stroke="#8b5cf6" stroke-width="26" fill="none" stroke-linecap="round"/>
    <circle cx="-142" cy="-18" r="14" fill="#e8b48a"/><circle cx="142" cy="-18" r="14" fill="#e8b48a"/>
    <!-- head -->
    <circle cx="0" cy="-60" r="46" fill="#e8b48a"/>
    <path d="M-46 -66 Q-40 -114 0 -112 Q40 -114 46 -66 Q30 -90 0 -88 Q-30 -90 -46 -66Z" fill="#3f2a1d"/>
    <circle cx="-16" cy="-60" r="5" fill="#1e293b"/><circle cx="16" cy="-60" r="5" fill="#1e293b"/>
    <path d="M-16 -36 Q0 -22 16 -36" stroke="#7c2d12" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-30" cy="-44" r="7" fill="#f87171" opacity=".5"/><circle cx="30" cy="-44" r="7" fill="#f87171" opacity=".5"/>
    <!-- feet -->
    <ellipse cx="-30" cy="226" rx="22" ry="10" fill="#78350f"/><ellipse cx="30" cy="226" rx="22" ry="10" fill="#78350f"/>
  </g>
  <!-- Little crown sparkle (he became a ruler) -->
  <g transform="translate(600 120)" fill="#facc15" stroke="#b45309" stroke-width="3">
    <path d="M-40 20 L-40 -14 L-20 4 L0 -24 L20 4 L40 -14 L40 20Z"/>
  </g>
</svg>
