<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="110" cy="100" r="48" fill="#fde047"/>
  <!-- Hills -->
  <path d="M0 360 Q200 260 420 340 Q620 410 800 320 V600 H0Z" fill="#86efac"/>
  <path d="M0 440 Q240 380 480 430 Q660 470 800 420 V600 H0Z" fill="#4ade80"/>
  <!-- Goliath (big, a little silly) -->
  <g transform="translate(590 160)">
    <rect x="-60" y="60" width="120" height="200" rx="40" fill="#64748b"/>
    <path d="M-60 120 H60" stroke="#475569" stroke-width="10"/>
    <rect x="-46" y="250" width="34" height="90" rx="14" fill="#78350f"/><rect x="12" y="250" width="34" height="90" rx="14" fill="#78350f"/>
    <circle cx="0" cy="20" r="52" fill="#d6a37a"/>
    <path d="M-56 16 Q-56 -50 0 -52 Q56 -50 56 16 Q40 -12 0 -12 Q-40 -12 -56 16Z" fill="#94a3b8"/>
    <rect x="-6" y="-12" width="12" height="38" fill="#94a3b8"/>
    <path d="M-30 18 l14 4 M30 18 l-14 4" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-20" cy="30" r="4" fill="#1e293b"/><circle cx="20" cy="30" r="4" fill="#1e293b"/>
    <path d="M-18 52 Q0 42 18 52" stroke="#7c2d12" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- shield and spear -->
    <circle cx="-86" cy="150" r="48" fill="#a8a29e" stroke="#78716c" stroke-width="8"/>
    <circle cx="-86" cy="150" r="10" fill="#78716c"/>
    <path d="M86 340 L86 -40" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    <path d="M86 -70 L72 -36 H100Z" fill="#94a3b8"/>
  </g>
  <!-- David with his sling -->
  <g transform="translate(200 400)">
    <path d="M-28 0 Q-30 -40 0 -44 Q30 -40 28 0 L32 76 H-32Z" fill="#f97316"/>
    <path d="M-30 30 H30" stroke="#78350f" stroke-width="6"/>
    <rect x="-24" y="74" width="18" height="40" rx="8" fill="#e8b48a"/><rect x="6" y="74" width="18" height="40" rx="8" fill="#e8b48a"/>
    <!-- arm swinging the sling -->
    <path d="M22 -24 Q60 -60 70 -100" stroke="#e8b48a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="-150" r="40" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M70 -100 Q90 -140 110 -170" stroke="#a16207" stroke-width="4" fill="none"/>
    <circle cx="112" cy="-174" r="9" fill="#94a3b8"/>
    <circle cx="0" cy="-70" r="34" fill="#e8b48a"/>
    <path d="M-34 -74 Q-30 -112 0 -110 Q32 -112 34 -74 Q22 -96 0 -94 Q-22 -96 -34 -74Z" fill="#7c2d12"/>
    <circle cx="-11" cy="-72" r="4" fill="#1e293b"/><circle cx="11" cy="-72" r="4" fill="#1e293b"/>
    <path d="M-12 -52 Q0 -42 12 -52" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Five smooth stones -->
  <g fill="#cbd5e1" stroke="#94a3b8" stroke-width="3">
    <ellipse cx="90" cy="540" rx="16" ry="11"/><ellipse cx="128" cy="548" rx="14" ry="10"/><ellipse cx="162" cy="538" rx="15" ry="10"/><ellipse cx="110" cy="566" rx="13" ry="9"/><ellipse cx="148" cy="568" rx="14" ry="9"/>
  </g>
  <!-- A sheep watching -->
  <g transform="translate(360 520)">
    <g fill="#fff"><circle r="22"/><circle cx="20" cy="-6" r="18"/><circle cx="-20" cy="-4" r="18"/><circle cx="0" cy="-16" r="18"/></g>
    <ellipse cx="34" cy="-4" rx="12" ry="14" fill="#334155"/><circle cx="38" cy="-8" r="2.5" fill="#fff"/>
    <path d="M-10 18 v16 M10 18 v16" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
