<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <g transform="translate(660 110)">
    <circle r="62" fill="#fde68a" opacity=".55"/>
    <circle r="46" fill="#facc15"/>
    <circle cx="-14" cy="-6" r="5" fill="#78350f"/>
    <circle cx="14" cy="-6" r="5" fill="#78350f"/>
    <path d="M-16 12 Q0 26 16 12" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-26" cy="8" r="6" fill="#fb923c" opacity=".6"/>
    <circle cx="26" cy="8" r="6" fill="#fb923c" opacity=".6"/>
  </g>

  <!-- Rainbow -->
  <g fill="none" stroke-width="22" opacity=".95">
    <path d="M60 420 A280 280 0 0 1 620 420" stroke="#ef4444"/>
    <path d="M82 420 A258 258 0 0 1 598 420" stroke="#f97316"/>
    <path d="M104 420 A236 236 0 0 1 576 420" stroke="#facc15"/>
    <path d="M126 420 A214 214 0 0 1 554 420" stroke="#22c55e"/>
    <path d="M148 420 A192 192 0 0 1 532 420" stroke="#3b82f6"/>
    <path d="M170 420 A170 170 0 0 1 510 420" stroke="#8b5cf6"/>
  </g>

  <!-- Clouds -->
  <g fill="#fff">
    <g transform="translate(130 120)"><circle r="30"/><circle cx="34" cy="-10" r="38"/><circle cx="74" r="30"/><rect x="0" y="0" width="74" height="30"/></g>
    <g transform="translate(470 70) scale(.8)"><circle r="30"/><circle cx="34" cy="-10" r="38"/><circle cx="74" r="30"/><rect x="0" y="0" width="74" height="30"/></g>
  </g>

  <!-- Dove with an olive leaf -->
  <g transform="translate(560 220)">
    <path d="M0 0 C20 -18 50 -14 60 4 C44 0 30 6 22 14 C14 10 6 6 0 0Z" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M18 2 C26 -30 50 -34 64 -26 C46 -20 36 -8 30 8Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="54" cy="0" r="2.5" fill="#1e293b"/>
    <path d="M60 4 L72 6 L60 9Z" fill="#f59e0b"/>
    <path d="M72 6 q14 -4 22 6 q-12 6 -22 -6Z" fill="#16a34a"/>
  </g>

  <!-- Sea -->
  <path d="M0 450 Q50 430 100 450 T200 450 T300 450 T400 450 T500 450 T600 450 T700 450 T800 450 V600 H0Z" fill="url(#sea)"/>

  <!-- The ark -->
  <g transform="translate(150 300)">
    <!-- cabin -->
    <rect x="110" y="40" width="250" height="90" rx="8" fill="#d97706"/>
    <path d="M90 44 L235 -20 L380 44Z" fill="url(#roof)"/>
    <rect x="140" y="62" width="44" height="40" rx="20" fill="#fef3c7"/>
    <rect x="212" y="62" width="44" height="40" rx="20" fill="#fef3c7"/>
    <rect x="284" y="62" width="44" height="40" rx="20" fill="#fef3c7"/>
    <!-- giraffe -->
    <g transform="translate(150 70)">
      <rect x="10" y="-60" width="10" height="60" rx="5" fill="#fbbf24"/>
      <ellipse cx="22" cy="-64" rx="16" ry="11" fill="#fbbf24"/>
      <circle cx="28" cy="-66" r="2.5" fill="#1e293b"/>
      <circle cx="14" cy="-48" r="3" fill="#b45309"/><circle cx="17" cy="-28" r="3" fill="#b45309"/>
      <path d="M14 -74 v-8 M22 -74 v-8" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- elephant -->
    <g transform="translate(226 78)">
      <circle cx="8" cy="0" r="20" fill="#94a3b8"/>
      <ellipse cx="-10" cy="0" rx="12" ry="16" fill="#cbd5e1"/>
      <path d="M22 4 q10 14 0 26" stroke="#94a3b8" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="14" cy="-4" r="2.5" fill="#1e293b"/>
    </g>
    <!-- lion -->
    <g transform="translate(306 80)">
      <circle r="22" fill="#ea580c"/>
      <circle r="15" fill="#fbbf24"/>
      <circle cx="-5" cy="-3" r="2.5" fill="#1e293b"/><circle cx="5" cy="-3" r="2.5" fill="#1e293b"/>
      <path d="M-4 6 q4 4 8 0" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- hull -->
    <path d="M0 120 H470 Q450 210 380 220 H90 Q20 210 0 120Z" fill="url(#wood)"/>
    <path d="M18 150 H452 M34 180 H436" stroke="#451a03" stroke-width="4" opacity=".45"/>
    <circle cx="80" cy="140" r="9" fill="#451a03" opacity=".4"/>
    <circle cx="390" cy="140" r="9" fill="#451a03" opacity=".4"/>
    <!-- Noah waving -->
    <g transform="translate(60 70)">
      <rect x="-14" y="10" width="28" height="44" rx="12" fill="#2563eb"/>
      <circle cx="0" cy="0" r="16" fill="#fcd9b6"/>
      <path d="M-14 4 Q0 30 14 4 Q10 18 0 22 Q-10 18 -14 4Z" fill="#e5e7eb"/>
      <circle cx="-5" cy="-3" r="2.2" fill="#1e293b"/><circle cx="5" cy="-3" r="2.2" fill="#1e293b"/>
      <path d="M14 18 L32 -6" stroke="#fcd9b6" stroke-width="8" stroke-linecap="round"/>
      <path d="M-14 -6 Q0 -22 14 -6" fill="#e5e7eb"/>
    </g>
  </g>

  <!-- Front waves -->
  <path d="M0 520 Q40 500 80 520 T160 520 T240 520 T320 520 T400 520 T480 520 T560 520 T640 520 T720 520 T800 520 V600 H0Z" fill="#0284c7" opacity=".85"/>
  <g fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M40 545 q20 -10 40 0"/><path d="M200 560 q20 -10 40 0"/><path d="M520 550 q20 -10 40 0"/><path d="M680 565 q20 -10 40 0"/>
  </g>
</svg>
