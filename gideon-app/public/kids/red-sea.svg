<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Pillar of cloud -->
  <path d="M400 30 q-40 0 -36 40 q-30 10 -16 44 q-16 30 22 40 q10 20 30 6 q20 14 30 -6 q38 -10 22 -40 q14 -34 -16 -44 q4 -40 -36 -40Z" fill="#fff" opacity=".9"/>
